<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Government College Hussainialam</title>
</head>
<body>

    <header>
        <h1>Pragnya Degree College</h1>
        <h2>Connect With Us</h2>
    </header>

    <nav>
        <a href="home.html">Home</a> | 
        <a href="departments.html">Departments</a> | 
        <a href="studentLife.html">Student Life</a> | 
        <a href="contact.html">Contact</a>
    </nav>
    <hr>

    <!-- Address Details -->
    <section id="info">
        <h2>Campus Location</h2>
        <p>
            <strong>Address:</strong> Khursheed Jah Devdi Complex, Shah Gunj, Old City, Hyderabad, Telangana, India.<br>
            <strong>Affiliation:</strong> Osmania University
        </p>
    </section>
    <hr>

    <!-- HTML Form Element -->
    <section id="admission-form">
        <h2>Student Inquiry Form</h2>
        <form>
            <label for="student-name">Full Name:</label><br>
            <input type="text" id="student-name" name="student-name" placeholder="Enter your full name" required><br><br>

            <label for="student-email">Email Address:</label><br>
            <input type="email" id="student-email" name="student-email" placeholder="example@mail.com" required><br><br>

            <label for="stream-choice">Interested Stream:</label><br>
            <select id="stream-choice" name="stream-choice">
                <option value="arts">Arts</option>
                <option value="science">Science</option>
                <option value="commerce">Commerce</option>
            </select><br><br>

            <label for="message">Your Message / Query:</label><br>
            <textarea id="message" name="message" rows="4" cols="40" placeholder="Ask your question here..."></textarea><br><br>

            <input type="submit" value="Submit Inquiry">
        </form>
    </section>
    <hr>

    <footer>
        <p>&copy; 2026 Pragnya Degree College.</p>
    </footer>

</body>
</html>
